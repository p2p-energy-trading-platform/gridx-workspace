version: '3'

vars:
  BASE_URL: 'git@github.com:p2p-energy-trading-platform'
  REPOS: 
    - gridx-infra
    - iot-simulation
    - frontend-web
    - matching-engine
    - frontend-mobile
    - protobuf
    - go-sdk
    - typescript-sdk
    - cpp-sdk
    - api-gateway
    - iot-ingestion-dispatch
    - auth-service
    - dewa-mock-app

tasks:
  default:
    cmds:
      - task --list
    silent: true

  repo-status:
    desc: "Checks git status of each repository"
    env:
      BASE_URL: "{{.BASE_URL}}"
      REPOS: '{{.REPOS | join " "}}'
    cmds:
      - bash ./scripts/status-repos.sh

  setup:
    desc: "Clones missing repositories and safely pulls updates for clean, tracked repositories."
    env:
      BASE_URL: "{{.BASE_URL}}"
      REPOS: '{{.REPOS | join " "}}'
    cmds:
      - bash ./scripts/sync-repos.sh

  switch-main:
    desc: "Safely switches each repo to 'main' if clean, up-to-date, and fully pushed"
    env:
      BASE_URL: "{{.BASE_URL}}"
      REPOS: '{{.REPOS | join " "}}'
    cmds:
      - bash ./scripts/switch-to-main.sh

  build:
    desc: "Rebuild and restart specific or all containers"
    cmds:
      - docker compose -f docker-compose.root.yml up -d --build {{.CLI_ARGS}}
  
  external:web:
    desc: "Build and run frontend-web on port 3000 (Production mode)"
    dir: frontend-web
    cmds:
      - npm run build
      - PORT=3000 npm run preview

  external:dewa:
    desc: "Build and run dewa-mock-app on port 3001 (Production mode)"
    dir: dewa-mock-app
    cmds:
      - npm run build
      - PORT=3001 npm run preview

  external:simulator:
    desc: "Build and run iot-simulation engine (Production mode)"
    dir: iot-simulation
    cmds:
      - npm run build
      - npm run start

  up:
    desc: "Spin up the the entire system"
    cmds:
      - docker compose -f docker-compose.root.yml up -d

  down:
    desc: "Stop all running system containers"
    cmds:
      - docker compose -f docker-compose.root.yml down {{.CLI_ARGS}}

  infra-up:
    desc: "Spin up only gridx-infra"
    cmds:
      - docker compose -f gridx-infra/docker-compose.yml -p gridx-infrastructure up -d

  infra-down:
    desc: "Stop all running gridx-infra"
    cmds:
      - docker compose -f gridx-infra/docker-compose.yml -p gridx-infrastructure down {{.CLI_ARGS}}

  logs:
    desc: "Tail logs for the core infrastructure containers"
    cmds:
      - docker compose -f docker-compose.root.yml logs -f {{.CLI_ARGS}}

  analyze:
    desc: "Run static complexity analysis for all GridX repositories"
    cmds:
      - bash ./scripts/complexity-analysis.sh

  db:seed-grids:
    desc: "Read grid.yaml and populate iot_data.grids table for iot-ingestion-dispatch"
    cmds:
      - python3 scripts/seed_grids.py